<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>VibeCaption AI - Free Instagram Caption & Hashtag Generator</title>

    <meta name="description" content="VibeCaption AI is a free AI Instagram caption generator that creates trendy captions, hashtags, bios, song ideas, and social media content from images and text.">

    <meta name="keywords" content="AI caption generator, Instagram caption generator, free caption generator, hashtag generator, VibeCaption AI, social media captions, Instagram captions Hindi">

    <meta name="robots" content="index, follow">

    <meta property="og:title" content="VibeCaption AI - Free Instagram Caption Generator">
    <meta property="og:description" content="Generate viral Instagram captions, hashtags, bios, and song ideas using AI.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vibecaption-ai-1.onrender.com">

  <style>
  * {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body {
    margin: 0;
    background: linear-gradient(135deg, #0f0f14, #1b1028);
    color: white;
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 950px;
    margin: auto;
    padding: 30px 16px;
  }

  h1 {
    font-size: 44px;
    margin-bottom: 10px;
    color: #ffffff;
  }

  p {
    color: #d7d7d7;
    font-size: 18px;
  }

  label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
    color: #ffffff;
  }

  textarea,
  input,
  select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #171722;
    color: white;
    font-size: 16px;
    outline: none;
  }

  textarea {
    min-height: 90px;
    resize: vertical;
  }

  input[type="file"] {
    background: transparent;
    border: 1px dashed #555;
  }

  button {
    margin-top: 15px;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: #7c3aed;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background: #6d28d9;
  }

  button:disabled {
    background: #333;
    color: #777;
    cursor: not-allowed;
  }

  .button-row,
  .copy-buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 16px;
  }

  #result,
  .result,
  .output {
    margin-top: 25px;
    padding: 18px;
    background: #171722;
    border: 1px solid #333;
    border-radius: 14px;
    color: white;
    white-space: pre-wrap;
    line-height: 1.6;
  }

  @media (max-width: 600px) {
    h1 {
      font-size: 34px;
    }

    .button-row,
    .copy-buttons {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>
  <div class="container">
    <div class="hero">
      <h1>VibeCaption AI</h1>
      <p>Generate Instagram captions, hashtags, reel hooks and song suggestions instantly.</p>
    </div>

    <div class="card">
      <label>Describe your photo/post</label>
      <textarea id="photoIdea" placeholder="Example: Luxury cafe photo, black outfit, confident entrepreneur vibe"></textarea>
<label>Upload Photo (optional)</label>
<input type="file" id="photoFile" accept="image/*" onchange="handleImageUpload(event)" />
<div id="imagePreviewBox" style="display:none; margin-top: 12px;">
  <img
    id="imagePreview"
    alt="Preview"
    style="width: 100%; max-height: 260px; object-fit: cover; border-radius: 14px; border: 1px solid #333344;"
  />
  <button type="button" onclick="removeImage()" style="background: #222; margin-top: 10px;">
    Remove Photo
  </button>
</div>
      <div class="grid">
        <div>
          <label>Mood / Vibe</label>
          <select id="mood">
            <option>Luxury</option>
            <option>Attitude</option>
            <option>Romantic</option>
            <option>Sad</option>
            <option>Travel</option>
            <option>Fitness</option>
            <option>Business</option>
            <option>Cinematic</option>
          </select>
        </div>

        <div>
          <label>Language</label>
          <select id="language">
            <option>Hinglish</option>
            <option>Hindi</option>
            <option>English</option>
          </select>
        </div>

        <div>
          <label>Post Type</label>
          <select id="postType">
            <option>Instagram Post</option>
            <option>Instagram Reel</option>
            <option>Instagram Story</option>
            <option>Profile Bio</option>
          </select>
        </div>

        <div>
          <label>Audience</label>
          <input id="audience" placeholder="Example: Indian youth, fashion lovers" />
        </div>
      </div>

      <button id="generateBtn" onclick="generateContent()">Generate Content</button>
<button onclick="copyResult()" style="background: #222; margin-top: 12px;">
  Copy Full Result
</button>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;">
  <button onclick="copyBestCaption()" style="background: #222; margin-top: 0;">
    Copy Caption
  </button>

  <button onclick="copyHashtags()" style="background: #222; margin-top: 0;">
    Copy Hashtags
  </button>

  <button onclick="copySongs()" style="background: #222; margin-top: 0;">
    Copy Songs
  </button>

  <button onclick="copyReelHook()" style="background: #222; margin-top: 0;">
    Copy Reel Hook
  </button>
</div>

      <div class="output" id="output">
        Your result will appear here...
      </div>
    </div>

    <div class="footer">
      Made for creators, influencers and social media pages.
    </div>
  </div>

         <script>
  const API_URL = "https://vibecaption-ai.onrender.com";

  let uploadedImageBase64 = "";
  let uploadedImageMimeType = "";

  function handleImageUpload(event) {
    const file = event.target.files[0];
    const previewBox = document.getElementById("imagePreviewBox");
    const preview = document.getElementById("imagePreview");

    if (!file) return;

    if (file.size > 2.5 * 1024 * 1024) {
      alert("Image size too large. Please upload an image smaller than 2.5MB.");
      event.target.value = "";
      return;
    }

    uploadedImageMimeType = file.type || "image/jpeg";

    const reader = new FileReader();

    reader.onload = function (e) {
      const dataUrl = e.target.result;
      uploadedImageBase64 = dataUrl.split(",")[1];

      preview.src = dataUrl;
      previewBox.style.display = "block";
    };

    reader.readAsDataURL(file);
  }

  function removeImage() {
    uploadedImageBase64 = "";
    uploadedImageMimeType = "";

    document.getElementById("photoFile").value = "";
    document.getElementById("imagePreview").src = "";
    document.getElementById("imagePreviewBox").style.display = "none";
  }
   function escapeHtml(text) {
  return text
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatResult(result) {
  const matches = [...result.matchAll(/(?:^|\n)([1-7])\.\s*([^\n]+)/g)];

  if (matches.length === 0) {
    return `<div class="result-card"><p>${escapeHtml(result)}</p></div>`;
  }

  let html = "";

  matches.forEach((match, index) => {
    const sectionNumber = match[1];
    const sectionTitle = match[2].trim();
    const startIndex = match.index + match[0].length;
    const endIndex = matches[index + 1] ? matches[index + 1].index : result.length;

    const sectionContent = result.slice(startIndex, endIndex).trim();

    html += `
      <div class="result-card">
        <h3>${sectionNumber}. ${escapeHtml(sectionTitle)}</h3>
        <p>${escapeHtml(sectionContent)}</p>
      </div>
    `;
  });

  return html;
}        

  async function generateContent() {
  const output = document.getElementById("output");
  const generateBtn = document.getElementById("generateBtn");
    
    const photoIdea = document.getElementById("photoIdea").value.trim();
    const mood = document.getElementById("mood").value;
    const language = document.getElementById("language").value;
    const postType = document.getElementById("postType").value;
    const audience = document.getElementById("audience").value.trim();

    if (!photoIdea && !uploadedImageBase64) {
      output.textContent = "Please write something or upload a photo first.";
      return;
    }

    output.textContent = "Generating...";
    generateBtn.textContent = "Generating...";
generateBtn.disabled = true;
generateBtn.style.opacity = "0.7";

    try {
      const response = await fetch(`${API_URL}/generate`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          photoIdea,
          mood,
          language,
          postType,
          audience,
          imageBase64: uploadedImageBase64,
          imageMimeType: uploadedImageMimeType
        })
      });

      const data = await response.json();

      if (!response.ok) {
  output.textContent = data.error || "Something went wrong.";
  generateBtn.textContent = "Generate Content";
  generateBtn.disabled = false;
  generateBtn.style.opacity = "1";
  return;
}

      output.innerHTML = formatResult(data.result);
      generateBtn.textContent = "Generate Content";
generateBtn.disabled = false;
generateBtn.style.opacity = "1";
    } catch (error) {
  output.textContent = "Backend connect नहीं हो रहा। API URL check करो।";
  generateBtn.textContent = "Generate Content";
  generateBtn.disabled = false;
  generateBtn.style.opacity = "1";
}
  }

  function copyResult() {
    const output = document.getElementById("output").textContent;

    if (!output || output.includes("Your result will appear")) {
      alert("No result to copy.");
      return;
    }

    navigator.clipboard.writeText(output);
    alert("Result copied successfully!");
  }
           function copySection(startNumber, endNumber, successMessage, errorMessage) {
  const output = document.getElementById("output").textContent;

  if (!output || output.includes("Your result will appear") || output.includes("Generating")) {
    alert("No generated result found.");
    return;
  }

  const startMarker = startNumber + ".";
  const endMarker = endNumber ? endNumber + "." : null;

  const startIndex = output.indexOf(startMarker);

  if (startIndex === -1) {
    alert(errorMessage);
    return;
  }

  let endIndex = -1;

  if (endMarker) {
    endIndex = output.indexOf(endMarker, startIndex + startMarker.length);
  }

  const sectionText = endIndex === -1
    ? output.slice(startIndex).trim()
    : output.slice(startIndex, endIndex).trim();

  navigator.clipboard.writeText(sectionText);
  alert(successMessage);
}

function copyBestCaption() {
  copySection(1, 2, "Best caption copied!", "Best caption not found.");
}

function copyHashtags() {
  copySection(3, 4, "Hashtags copied!", "Hashtags not found.");
}

function copySongs() {
  copySection(4, 5, "Song suggestions copied!", "Songs not found.");
}

function copyReelHook() {
  copySection(5, 6, "Reel hook copied!", "Reel hook not found.");
}
</script>   
</body>
</html>
